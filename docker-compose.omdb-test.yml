services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rio_theaters_test
      POSTGRES_USER: rio_test
      POSTGRES_PASSWORD: rio_test_only
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
