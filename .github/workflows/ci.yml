name: CI

on:
  push:
    branches-ignore:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-database-changes:
    name: Detect database changes
    runs-on: ubuntu-latest

    outputs:
      database: ${{ steps.detect.outputs.database }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed database files
        id: detect
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "database=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi

          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git merge-base HEAD origin/main)"
          fi

          if git diff --name-only "$base" HEAD -- db/ .github/workflows/ci.yml | grep -q .; then
            echo "database=true" >> "$GITHUB_OUTPUT"
          else
            echo "database=false" >> "$GITHUB_OUTPUT"
          fi

  version-check:
    name: Validate VERSION files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed component versions
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/check-version.mjs

  jest-tests:
    name: Jest - ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: Frontend
            id: frontend
            directory: frontend

          - name: Backend
            id: backend
            directory: backend

          - name: Booking
            id: booking
            directory: services/booking

          - name: Login
            id: login
            directory: services/login

          - name: Payment
            id: payment
            directory: services/payment

          - name: Movies
            id: movies
            directory: services/movies

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: ${{ matrix.directory }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies for frontend integration tests
        if: matrix.id == 'frontend'
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Run Jest tests
        working-directory: ${{ matrix.directory }}
        run: pnpm test

      - name: Upload Jest CTRF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctrf-${{ matrix.id }}
          path: ${{ matrix.directory }}/ctrf/ctrf-report.json
          if-no-files-found: warn
          retention-days: 14

  frontend-quality:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  playwright-tests:
    name: Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        run: pnpm test:e2e

      - name: Upload Playwright CTRF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctrf-playwright
          path: frontend/ctrf/ctrf-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  database-tests:
    name: PostgreSQL schema and migration tests
    needs: detect-database-changes
    if: needs.detect-database-changes.outputs.database == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: rio_schema_test
          POSTGRES_USER: rio
          POSTGRES_PASSWORD: ci_test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U rio -d rio_schema_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: db/pnpm-lock.yaml

      - name: Validate database migration policy
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node db/scripts/validate-migrations.mjs

      - name: Install database test dependencies
        working-directory: db
        run: pnpm install --frozen-lockfile

      - name: Test fresh and existing database migrations
        shell: bash
        env:
          DB_TEST_URL: postgresql://rio:ci_test_password@127.0.0.1:5432/rio_schema_test
        run: |
          flyway_run() {
            local schema="$1"
            shift

            docker run --rm \
              --network host \
              --mount "type=bind,source=$GITHUB_WORKSPACE/db/migrations,target=/flyway/sql,readonly" \
              -e FLYWAY_URL=jdbc:postgresql://127.0.0.1:5432/rio_schema_test \
              -e FLYWAY_USER=rio \
              -e FLYWAY_PASSWORD=ci_test_password \
              flyway/flyway:13.12.1 \
              -locations=filesystem:/flyway/sql \
              -schemas="$schema" \
              -defaultSchema="$schema" \
              -baselineOnMigrate=false \
              -cleanDisabled=true \
              -validateMigrationNaming=true \
              -group=true \
              -executeInTransaction=true \
              -mixed=false \
              -outOfOrder=false \
              "$@"
          }

          flyway_run ci_fresh migrate
          flyway_run ci_fresh validate

          flyway_run ci_upgrade -target=1 migrate

          node db/scripts/seed-upgrade.mjs

          node db/scripts/verify-migration-data.mjs \
              capture "$RUNNER_TEMP/rio-migration-before.json"

          flyway_run ci_upgrade migrate
          flyway_run ci_upgrade validate

          node db/scripts/verify-migration-data.mjs \
              verify "$RUNNER_TEMP/rio-migration-before.json"

          flyway_run ci_upgrade migrate

      - name: Verify grouped Flyway transaction rollback
        env:
          DB_TEST_URL: postgresql://rio:ci_test_password@127.0.0.1:5432/rio_schema_test
        run: node db/scripts/verify-group-rollback.mjs

      - name: Run database schema and migration tests
        working-directory: db
        env:
          DB_TEST_URL: postgresql://rio:ci_test_password@127.0.0.1:5432/rio_schema_test
        run: pnpm test

      - name: Upload database CTRF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctrf-database
          path: db/ctrf/ctrf-report.json
          if-no-files-found: warn
          retention-days: 14

  container-builds:
    name: Docker build - ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 3

      matrix:
        include:
          - name: Frontend
            directory: frontend

          - name: Backend
            directory: backend

          - name: Booking
            directory: services/booking

          - name: Login
            directory: services/login

          - name: Payment
            directory: services/payment

          - name: Movies
            directory: services/movies

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify Docker image builds successfully
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.directory }}
          file: ${{ matrix.directory }}/Dockerfile
          platforms: linux/amd64
          push: false

  report-tests:
    name: Consolidated Test Report
    if: always()

    needs:
      - detect-database-changes
      - version-check
      - jest-tests
      - frontend-quality
      - playwright-tests
      - database-tests

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download CTRF artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ctrf-*
          path: reports/input

      - name: Generate combined CTRF and HTML reports
        env:
          DATABASE_REQUIRED: ${{ needs.detect-database-changes.outputs.database }}
        run: node .github/scripts/generate-test-report.mjs

      - name: Publish individual test results to GitHub
        if: always() && hashFiles('reports/output/combined-ctrf.json') != ''
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: reports/output/combined-ctrf.json
          summary-report: true
          test-list-report: true
          failed-report: true
          annotate: false
          exit-on-no-files: true

      - name: Upload consolidated test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rio-theaters-test-report
          path: reports/output/
          if-no-files-found: error
          retention-days: 14

  ci-gate:
    name: Required CI checks
    if: always()

    needs:
      - detect-database-changes
      - version-check
      - jest-tests
      - frontend-quality
      - playwright-tests
      - database-tests
      - report-tests
      - container-builds

    runs-on: ubuntu-latest

    steps:
      - name: Verify CI results
        shell: bash

        env:
          DETECT_STATUS: ${{ needs.detect-database-changes.result }}
          VERSION_STATUS: ${{ needs.version-check.result }}
          JEST_STATUS: ${{ needs.jest-tests.result }}
          FRONTEND_STATUS: ${{ needs.frontend-quality.result }}
          PLAYWRIGHT_STATUS: ${{ needs.playwright-tests.result }}
          DATABASE_STATUS: ${{ needs.database-tests.result }}
          DATABASE_CHANGED: ${{ needs.detect-database-changes.outputs.database }}
          REPORT_STATUS: ${{ needs.report-tests.result }}

        run: |
          failed=0

          for status in "$DETECT_STATUS" "$VERSION_STATUS" "$JEST_STATUS" "$FRONTEND_STATUS" "$PLAYWRIGHT_STATUS" "$REPORT_STATUS"; do
            if [ "$status" != "success" ]; then
              echo "Required job result: $status"
              failed=1
            fi
          done

          if [ "$DATABASE_CHANGED" = "true" ] && [ "$DATABASE_STATUS" != "success" ]; then
            echo "Database tests are required but finished with: $DATABASE_STATUS"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          echo "All required CI checks passed."
