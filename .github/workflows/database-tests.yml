name: Database Schema Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'db/schema.sql'
      - 'db/tests/**'
      - 'db/package.json'
      - 'db/pnpm-lock.yaml'
      - 'db/pnpm-workspace.yaml'
      - '.github/workflows/database-tests.yml'

  push:
    branches:
      - cicd_implementation

  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-tests:
    name: Validate PostgreSQL Schema
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: rio_schema_test
          POSTGRES_USER: rio
          POSTGRES_PASSWORD: ci_test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U rio -d rio_schema_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: db/pnpm-lock.yaml

      - name: Install database test dependencies
        working-directory: db
        run: pnpm install --frozen-lockfile

      - name: Run database schema tests
        working-directory: db
        env:
          DB_TEST_URL: postgresql://rio:ci_test_password@127.0.0.1:5432/rio_schema_test
        run: pnpm test
