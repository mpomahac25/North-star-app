apiVersion: batch/v1
kind: Job
metadata:
  name: rio-schema-init

spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300

  template:
    spec:
      restartPolicy: Never

      containers:
        - name: schema-init
          image: docker.io/library/postgres:17-alpine
          imagePullPolicy: IfNotPresent

          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: rio-postgres
                  key: POSTGRESQL_USER

            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: rio-postgres
                  key: POSTGRESQL_DATABASE

            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rio-postgres
                  key: POSTGRESQL_PASSWORD

          command:
            - /bin/sh
            - -ec

          args:
            - |
              until pg_isready \
                -h postgres \
                -p 5432 \
                -U "$POSTGRESQL_USER" \
                -d "$POSTGRESQL_DATABASE"; do
                sleep 2
              done

              export PGPASSWORD="$POSTGRESQL_PASSWORD"

              psql \
                --single-transaction \
                -v ON_ERROR_STOP=1 \
                -h postgres \
                -p 5432 \
                -U "$POSTGRESQL_USER" \
                -d "$POSTGRESQL_DATABASE" \
                -f /schema/schema.sql

          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: Localhost
              localhostProfile: rahti-custom-seccomp.json

      volumes:
        - name: schema
          configMap:
            name: rio-schema