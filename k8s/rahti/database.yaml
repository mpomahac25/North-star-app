# Persistent storage for PostgreSQL
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-csi
  resources:
    requests:
      storage: 8Gi

---

# PostgreSQL deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres
          image: docker.io/mpomahac25/rio-theaters-postgres:17.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: postgres
              containerPort: 5432

          # PostgreSQL configuration is provided through a Kubernetes Secret
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: rio-postgres
                  key: POSTGRESQL_USER

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: rio-postgres
                  key: POSTGRESQL_DATABASE

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rio-postgres
                  key: POSTGRESQL_PASSWORD

          # Mount persistent database storage
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 20
            timeoutSeconds: 5

          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data

---

# Internal PostgreSQL service
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: ClusterIP

  selector:
    app: postgres

  ports:
    - name: postgres
      port: 5432
      targetPort: postgres